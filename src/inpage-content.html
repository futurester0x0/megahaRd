<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>megahaRd</title>
    <link rel="stylesheet" href="content_script.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body class="mhc-container">

    <header>
        <h1 class="mhc-title"></h1>
    </header>

    <main class="mhc-badge-prompt">
        <!-- Login -->
        <section id="mhc-login" class="is-hidden">
            <div class="mhc-badge-prompt-contents">
                <p class="mhc-subtitle-login"></p>
                <p class="mhc-bodytext-login"></p>

                <div class="mhc-badge-prompt-buttons">
                    <button class="mhc-badge-prompt-btn-cancel"></button>
                    <button class="mhc-badge-prompt-btn-allow"></button>
                </div>
            </div>
        </section>

        <!-- Email -->
        <section id="mhc-email" class="is-hidden">
            <div class="mhc-badge-prompt-contents">
                <p class="mhc-subtitle-email"></p>
                <p class="mhc-bodytext-email"></p>
                <div class="mhc-badge-prompt-dontShowAgain-checkbox">
                    <input type="checkbox" id="hideRelayEmailBadges" class="mhc-badge-prompt-dontShowAgain-checkbox-input settings-checkbox">
                    <label class="mhc-email-checkbox" for="hideRelayEmailBadges"></label>
                </div>
                <div class="mhc-badge-prompt-buttons">
                    <button class="mhc-badge-email-btn-dismiss"></button>
                    <button class="mhc-badge-email-btn-cta-fx-relay"></button>
                </div>

            </div>
        </section>
    </main>

    <script src="inpage-content.js"></script>
</body>
</html>
